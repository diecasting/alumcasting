{{/* S.6-C.2-H JSON-LD wiring. jsonify output MUST be marked safeJS so Go's
   template engine does not escape the JSON double-quotes inside <script>. */}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": {{ "https://alumcasting.com/#organization" | jsonify | safeJS }},
  "name": "AlumCasting",
  "legalName": "Kingship (Dongguan) Precision Manufacturing Co., Ltd.",
  "url": "https://alumcasting.com/",
  "logo": "https://alumcasting.com/wp-content/uploads/2026/03/KingShip-Logo.png"
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": {{ printf "%s#webpage" .Permalink | jsonify | safeJS }},
  "url": {{ .Permalink | jsonify | safeJS }},
  "name": {{ .Title | jsonify | safeJS }},
  "description": {{ .Description | jsonify | safeJS }},
  "isPartOf": { "@id": {{ "https://alumcasting.com/#organization" | jsonify | safeJS }} },
  "breadcrumb": {
    "@type": "BreadcrumbList",
    "@id": {{ printf "%s#breadcrumb" .Permalink | jsonify | safeJS }},
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ .Site.Home.Permalink | jsonify | safeJS }} }{{ if not .IsHome }},
      { "@type": "ListItem", "position": 2, "name": {{ .Title | jsonify | safeJS }}, "item": {{ .Permalink | jsonify | safeJS }} }{{ end }}
    ]
  }
}
</script>

{{ with .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
  {{- range $i, $item := . -}}
    {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.question | jsonify | safeJS }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $item.answer | jsonify | safeJS }}
      }
    }
  {{- end -}}
  ]
}
</script>
{{ end }}
