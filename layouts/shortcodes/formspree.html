{{- /* S.6-C.3-A contact RFQ form. Formspree endpoint forwards to
   hank@alumcasting.com (per diecasting site-group convention). No JS,
   no external brand leak, env-safe (static action URL). */ -}}
<style>
.rfq-form{max-width:640px;margin:1.5rem 0;font-family:inherit}
.rfq-form .rfq-row{display:flex;gap:1rem;flex-wrap:wrap}
.rfq-form label{display:block;flex:1 1 240px;margin:.4rem 0;font-weight:600;font-size:.95rem}
.rfq-form input,.rfq-form textarea{display:block;width:100%;margin-top:.3rem;padding:.55rem;
  border:1px solid #b7c4d6;border-radius:6px;font:inherit;font-weight:400;box-sizing:border-box}
.rfq-form button{margin-top:.8rem;padding:.65rem 1.4rem;border:0;border-radius:6px;cursor:pointer;
  background:#1e88e5;color:#fff;font:inherit;font-weight:700}
.rfq-form button:hover{background:#0d4a8e}
</style>
<form class="rfq-form" action="https://formspree.io/f/xpqgbdly" method="POST">
  <input type="hidden" name="_subject" value="AlumCasting RFQ — New Inquiry">
  <div class="rfq-row">
    <label for="rfq-name">Name *<input id="rfq-name" type="text" name="name" required></label>
    <label for="rfq-email">Email *<input id="rfq-email" type="email" name="email" required></label>
  </div>
  <div class="rfq-row">
    <label for="rfq-company">Company<input id="rfq-company" type="text" name="company"></label>
    <label for="rfq-phone">Phone<input id="rfq-phone" type="tel" name="phone"></label>
  </div>
  <label for="rfq-message">Project details *<textarea id="rfq-message" name="message" rows="6" required></textarea></label>
  <button type="submit">Send RFQ</button>
</form>
