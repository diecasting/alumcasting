# AlumCasting Hugo migration — STAGING build on GitHub Pages (project subpath).
# baseURL must include the /alumcasting/ repo subpath so all internal links resolve
# on https://diecasting.github.io/alumcasting/ (GitHub Pages project sites serve at
# the repo subpath, NOT root). CI still overrides with --baseURL "$pages.base_url/"
# (identical value) for robustness. During production cutover (S.6-C.x) this becomes
# https://alumcasting.com/.
# Hugo Extended version is pinned in .github/workflows/deploy.yml (0.163.3).

baseURL = "https://diecasting.github.io/alumcasting/"
title = "AlumCasting"

defaultContentLanguage = "en"

[languages.en]
  locale = "en-US"
  weight = 1

# No theme/submodule — minimal custom layouts only (no Blowfish demo residue).
enableGitInfo = false
enableEmoji = false

# Absolute URLs driven solely by baseURL so a production baseURL swap
# requires no content-editing (S.6-C.x cutover).
relativeURLs = false

[pagination]
  size = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = false

# Sitemap generated by Hugo's default sitemap template.
# Robots served from static/robots.txt (foundation; refined in S.6-C.2).

# A.3 marketing / conversion tracking (Tier-1). Public IDs only — not secrets.
# Google Ads Conversion Label intentionally empty: the Ads conversion send_to
# event is deferred until the label is supplied. Do NOT fabricate one.
[params.marketing]
  enable_analytics  = true
  ga4_id           = "G-PWNDQRH47H"
  google_ads_id    = "AW-10858887459"
  google_ads_label = ""
